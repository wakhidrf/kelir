name: kelir-checks

# Pemeriksaan kit yang SELF-CONTAINED (issue #72). Gate parity/status yang
# butuh STYLE.md + <proyek>/src TIDAK jalan di sini: kontrak §5 tinggal di
# akar proyek induk, bukan di repo kit. Semua gate penuh
# (drift/guard/status:check/anti-slop) dijalankan CI repo induk. Di sini
# kit memastikan skrip + integrasi antislop tetap lolos parse (fail-fast PR kit).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse-check skrip kit + integrasi antislop
        run: |
          fail=0
          for f in scripts/*.mjs kelir-integration/tools/*.mjs; do
            if [ -f "$f" ]; then
              echo "node --check $f"
              node --check "$f" || fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Ada berkas .mjs yang gagal parse."
            exit 1
          fi
          echo "OK - skrip kit + integrasi antislop lolos parse."
      - name: Mirror anti-slop tidak drift
        run: |
          node kelir-integration/tools/sync-antislop.mjs --check
          node kelir-integration/tools/build-antislop-index.mjs --check
      - name: Catatan gate penuh
        run: |
          echo "Gate parity/status (kelir:drift, kelir:guard:strict, kelir:hunt:strict, kelir:status:check, kelir:slop:strict)"
          echo "butuh STYLE.md + <proyek>/src; dijalankan otomatis di CI repo induk."
